# Build recipe for AWS Amplify Hosting. Amplify reads this on every push to main:
#   1. backend: install, type-check the app, run the tests, and only then
#      create or update the logins, database and functions (a red test stops
#      the stack from shipping even if someone bypasses the pull request)
#   2. frontend: build and publish the dist folder
version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22 || true
        - node -v
        - npm ci --cache .npm --prefer-offline
        - npm run typecheck
        - npm test
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
