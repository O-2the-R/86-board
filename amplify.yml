# Build recipe for AWS Amplify Hosting. Amplify reads this on every push:
#   1. backend: create or update the logins, database and functions, and
#      write amplify_outputs.json for the app to read
#   2. frontend: type-check, build, publish the dist folder
version: 1
backend:
  phases:
    build:
      commands:
        - nvm install 22 || true
        - node -v
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
